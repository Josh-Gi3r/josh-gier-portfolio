<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Josh Gier | Technical CV</title>
<style>
html,body{margin:0;min-height:100%;background:#edf0f4;color:#171c24;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#loading{min-height:100vh;display:grid;place-items:center;font-size:13px;color:#66717f}
</style>
</head>
<body>
<div id="loading" role="status" aria-live="polite">Loading technical CV…</div>
<script>
(async()=>{
  const loading=document.getElementById('loading');
  try{
    if(!('DecompressionStream' in window)) throw new Error('Browser does not support DecompressionStream');
    const response=await fetch('./payload.b64',{cache:'no-store'});
    if(!response.ok) throw new Error(`payload ${response.status}`);
    const b64=(await response.text()).trim();
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    loading.textContent='Unable to load technical CV.';
  }
})();
</script>
</body>
</html>
