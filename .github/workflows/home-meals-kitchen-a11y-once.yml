name: Home Meals Kitchen a11y patch once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/home-meals-kitchen-a11y-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Label Kitchen search input
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/home-meals/components/app/Kitchen.tsx')
          s=p.read_text()
          old='placeholder={`Find in the ${tab.toLowerCase()}`}/>'
          new='placeholder={`Find in the ${tab.toLowerCase()}`} aria-label={`Find in the ${tab.toLowerCase()}`}/>'
          if old not in s:
              raise SystemExit('Kitchen search input target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/home-meals/components/app/Kitchen.tsx
          git commit -m "Home Meals: label Kitchen search input"
          git push origin HEAD:main
