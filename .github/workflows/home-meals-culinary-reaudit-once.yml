name: Home Meals culinary re-audit patch once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/home-meals-culinary-reaudit-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Surface reference kcal and meal weight
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/home-meals/components/app/Recipe.tsx')
          s=p.read_text()
          reps=[
            ('import {recipeSubtitle,recipeTitle} from "@/data/recipe-display";','import {recipeSubtitle,recipeTitle} from "@/data/recipe-display";\nimport {kcalReferenceForV3} from "@/data/recipe-kcal-reference-v3";'),
            ('if(!f||!truth)throw new Error(`Missing canonical dinner formulation: ${id}`);const ready=useReadiness()(r);','if(!f||!truth)throw new Error(`Missing canonical dinner formulation: ${id}`);const ready=useReadiness()(r);const kcal=kcalReferenceForV3(id);'),
            ('<div className="hm-stats four"><Stat v={r.minutes} k="reference min"/><Stat v="—" k="kcal" tint="var(--tint-peach)"/><Stat v="—" k="protein"/><Stat v={f.targetServings} k="target servings" tint="var(--tint-sky)"/></div>','<div className="hm-stats four"><Stat v={r.minutes} k="reference min"/><Stat v={kcal?`~${kcal.kcalPerPerson}`:"—"} k="kcal / person" tint="var(--tint-peach)"/><Stat v={kcal?kcal.mealWeight:"—"} k="meal weight"/><Stat v={f.targetServings} k="target servings" tint="var(--tint-sky)"/></div>'),
            ('<div className="hm-fine">Nutrition appears only after component yield + product-label truth is resolved · {r.method} · {r.difficulty}</div>','<div className="hm-fine">{kcal?`Reference energy estimate · ±${kcal.uncertaintyPct}% until measured prep yield + product-label truth resolves`:"Energy not yet estimated"} · {r.method} · {r.difficulty}</div>')
          ]
          for old,new in reps:
              if old not in s: raise SystemExit('Recipe kcal UI target not found: '+old[:100])
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/home-meals/components/app/Recipe.tsx
          git commit -m "Home Meals: show reference kcal and meal weight"
          git push origin HEAD:main
