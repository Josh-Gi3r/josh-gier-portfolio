name: Home Meals Kitchen dynamic a11y once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/home-meals-kitchen-dynamic-a11y-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Label dynamic Kitchen controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/home-meals/components/app/Kitchen.tsx')
          s=p.read_text()
          reps=[
            ('<div className="hm-seg" role="tablist">','<div className="hm-seg" role="tablist" aria-label="Kitchen sections">'),
            ('<button type="button" className="clear" onClick={()=>setQ("")}>×</button>','<button type="button" className="clear" aria-label="Clear Kitchen search" onClick={()=>setQ("")}>×</button>'),
            ('<button className="thumb" onClick={()=>onEdit(m.id)} style={{overflow:"hidden",padding:0}}>','<button className="thumb" aria-label={`Edit ${m.name}`} onClick={()=>onEdit(m.id)} style={{overflow:"hidden",padding:0}}>'),
            ('<button className="minus" onClick={()=>setComponent(m.id,Math.max(0,(componentStock[m.id]??0)-truth.workingUnit.qty))}>−</button>','<button className="minus" aria-label={`Remove one ${m.name} working portion`} onClick={()=>setComponent(m.id,Math.max(0,(componentStock[m.id]??0)-truth.workingUnit.qty))}>−</button>'),
            ('<button className="plus" onClick={()=>setComponent(m.id,(componentStock[m.id]??0)+truth.workingUnit.qty)}>+</button>','<button className="plus" aria-label={`Add one ${m.name} working portion`} onClick={()=>setComponent(m.id,(componentStock[m.id]??0)+truth.workingUnit.qty)}>+</button>'),
            ('<button style={{width:44,height:44,borderRadius:14,overflow:"hidden",padding:0,background:toneGradient(c.id),color:"#fff",fontSize:10,fontWeight:800,display:"grid",placeItems:"center"}} onClick={()=>onEdit(c.id)}>','<button aria-label={`Edit ${c.name}`} style={{width:44,height:44,borderRadius:14,overflow:"hidden",padding:0,background:toneGradient(c.id),color:"#fff",fontSize:10,fontWeight:800,display:"grid",placeItems:"center"}} onClick={()=>onEdit(c.id)}>'),
            ('<button className="minus" onClick={()=>h.setComponent(c.id,Math.max(0,(h.componentStock[c.id]??0)-truth.workingUnit.qty))}>−</button>','<button className="minus" aria-label={`Remove one ${c.name} working portion`} onClick={()=>h.setComponent(c.id,Math.max(0,(h.componentStock[c.id]??0)-truth.workingUnit.qty))}>−</button>'),
            ('<button className="plus" onClick={()=>h.setComponent(c.id,(h.componentStock[c.id]??0)+truth.workingUnit.qty)}>+</button>','<button className="plus" aria-label={`Add one ${c.name} working portion`} onClick={()=>h.setComponent(c.id,(h.componentStock[c.id]??0)+truth.workingUnit.qty)}>+</button>'),
          ]
          for old,new in reps:
              if old not in s:
                  raise SystemExit('Kitchen target not found: '+old[:80])
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/home-meals/components/app/Kitchen.tsx
          git commit -m "Home Meals: label dynamic Kitchen controls"
          git push origin HEAD:main
