name: Home Meals CI

on:
  push:
    branches: [main]
    paths:
      - "apps/home-meals/**"
      - ".github/workflows/home-meals-ci.yml"
  pull_request:
    paths:
      - "apps/home-meals/**"
      - ".github/workflows/home-meals-ci.yml"

concurrency:
  group: home-meals-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/home-meals
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/home-meals/package-lock.json
      - name: Align npm with production
        run: npm install --global npm@10.9.8 && npm --version
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Food truth audits
        run: npm run audit:data
      - name: Production build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        run: npm run test:e2e
